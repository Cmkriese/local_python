<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Grocery Organizer project starter">
  <title>Grocery Organizer</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Segoe UI", system-ui, sans-serif;
      color: #1f2937;
      background: #f5f7f4;
    }

    * {
      box-sizing: border-box;
    }

    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      place-items: center;
    }

    main {
      width: min(100%, 640px);
      padding: 32px;
      background: #fff;
      border: 1px solid #dfe5dc;
      border-radius: 12px;
    }

    h1 {
      margin-top: 0;
      color: #25643b;
    }

    p {
      line-height: 1.6;
    }

    a {
      color: #25643b;
    }
  </style>
</head>
<body>
  <main>
    <h1>Grocery Organizer</h1>
    <p>The project starter is ready. App requirements and behavior are being defined.</p>
    <p>See <a href="spec.md">the project specification</a> to record agreed requirements.</p>
  </main>
</body>
</html>
